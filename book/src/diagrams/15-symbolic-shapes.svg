<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="ch15-symshapes-title ch15-symshapes-desc">
  <title id="ch15-symshapes-title">Static versus symbolic shapes</title>
  <desc id="ch15-symshapes-desc">With static shapes each sequence length 5, 6 and 7 builds and compiles its own plan; with a bounded symbolic length all three bind a variable n and launch one kernel compiled once.</desc>
  <defs>
    <marker id="ch15-symshapes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="ch15-symshapes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="40" y="40" width="880" height="196" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <rect x="40" y="264" width="880" height="196" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="60" y="64" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="start" letter-spacing="0.12em">STATIC SHAPES · UOPC TODAY</text>
  <text x="60" y="288" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="start" letter-spacing="0.12em">SYMBOLIC SHAPES · DESIGN EXERCISE</text>
  <path d="M 224 100 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <path d="M 224 150 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <path d="M 224 200 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <rect x="64" y="80" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="80" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="105.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=5</text>
  <rect x="328" y="80" width="240" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="328" y="80" width="240" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="448.0" y="105.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">new plan + gcc for T=5</text>
  <rect x="64" y="130" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="130" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="155.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=6</text>
  <rect x="328" y="130" width="240" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="328" y="130" width="240" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="448.0" y="155.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">new plan + gcc for T=6</text>
  <rect x="64" y="180" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="180" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="205.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=7</text>
  <rect x="328" y="180" width="240" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="328" y="180" width="240" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="448.0" y="205.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">new plan + gcc for T=7</text>
  <text x="600" y="140" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75" text-anchor="start">one plan per length:</text>
  <text x="600" y="160" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75" text-anchor="start">2.3–2.8 s each, measured</text>
  <path d="M 224 324 H 258 Q 266 324 266 332 V 354 Q 266 362 274 362 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <path d="M 224 376 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <path d="M 224 428 H 270 Q 278 428 278 420 V 398 Q 278 390 286 390 H 326" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow)"/>
  <path d="M 528 376 H 596" stroke="#bf4520" stroke-width="1.2" fill="none" marker-end="url(#ch15-symshapes-arrow-accent)"/>
  <rect x="64" y="304" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="304" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="329.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=5</text>
  <rect x="64" y="356" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="356" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="381.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=6</text>
  <rect x="64" y="408" width="160" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="408" width="160" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144.0" y="433.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">model(x), T=7</text>
  <rect x="328" y="348" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="328" y="348" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="428.0" y="372.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">bind n = T</text>
  <text x="428.0" y="390.0" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75" text-anchor="middle">guard 1 ≤ n ≤ 16</text>
  <rect x="598" y="348" width="260" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="598" y="348" width="260" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="728.0" y="372.0" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="middle" font-weight="600">kernel(…, int n)</text>
  <text x="728.0" y="390.0" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" text-anchor="middle">compiled once</text>
  <text x="598" y="440" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75" text-anchor="start">one plan for every length</text>
</svg>

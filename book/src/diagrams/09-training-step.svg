<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="step-title step-desc">
  <title id="step-title">The 32 kernels of one MNIST training step</title>
  <desc id="step-desc">A strip of the 32 kernels of one warm training step of the MNIST MLP, in execution order, each as wide as its measured run time (3.95 ms in total). Forward kernels take 1.01 ms, backward 1.21 ms, the twelve AdamW update kernels 1.67 ms and the loss 0.06 ms. The six kernels that touch the 784 by 128 weight W1 take 2.79 ms.</desc>

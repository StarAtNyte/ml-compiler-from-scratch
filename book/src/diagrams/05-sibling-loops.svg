<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="05-sibling-loops-title 05-sibling-loops-desc">
  <title id="05-sibling-loops-title">Choosing between sibling loops</title>
  <desc id="05-sibling-loops-desc">With loop i open, both j and k are candidates; the output store needs j and reads the row max, which is read after END of k, so the END propagates to the store and blocks j, and the scheduler opens k first.</desc>
  <defs>
    <marker id="05-sibling-loops-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="05-sibling-loops-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <!-- connectors -->
  <path d="M320,118 H224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#05-sibling-loops-arrow)"/>
  <path d="M320,298 H224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#05-sibling-loops-arrow)"/>
  <path d="M520,118 H618" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-sibling-loops-arrow)"/>
  <path d="M720,146 V268" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#05-sibling-loops-arrow-accent)"/>
  <path d="M620,298 H522" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#05-sibling-loops-arrow-accent)"/>
  <rect x="247" y="95" width="50" height="15" rx="2" fill="#f5f5f5"/>
  <text x="272" y="106" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">NEEDS</text>
  <rect x="247" y="275" width="50" height="15" rx="2" fill="#f5f5f5"/>
  <text x="272" y="286" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">NEEDS</text>
  <rect x="727" y="201" width="96" height="15" rx="2" fill="#f5f5f5"/>
  <text x="732" y="212" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.06em">ended = {k}</text>
  <!-- nodes -->
  <rect x="40" y="90" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="130" y="114" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">RANGE k</text>
  <text x="130" y="132" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">opened first</text>
  <rect x="40" y="270" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="130" y="294" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">RANGE j</text>
  <text x="130" y="312" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">blocked</text>
  <rect x="320" y="90" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="420" y="114" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">update</text>
  <text x="420" y="132" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">acc = max(acc, x[i,k])</text>
  <rect x="320" y="270" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="420" y="294" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">STORE</text>
  <text x="420" y="312" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">out[i,j] = x[i,j] - m</text>
  <rect x="620" y="90" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="720" y="114" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">END k</text>
  <text x="720" y="132" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">the reduction is done</text>
  <rect x="620" y="270" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="720" y="294" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">LOAD m</text>
  <text x="720" y="312" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">AFTER(acc, END k)[0]</text>
  <text x="40" y="44" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">WITH cur = (i): CANDIDATE LOOPS j AND k</text>
  <text x="40" y="372" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">the store needs j but has (transitively) read the END of sibling k, so j waits;</text>
  <text x="40" y="394" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">using k's loop variable, like i*M + k, never blocks anything</text>
  <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="40" y="450" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">LEGEND</text>
  <line x1="130" y1="446" x2="174" y2="446" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-sibling-loops-arrow)"/>
  <text x="186" y="450" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">data dependency</text>
  <line x1="340" y1="446" x2="384" y2="446" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#05-sibling-loops-arrow)"/>
  <text x="396" y="450" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">next loop on the node's target path</text>
  <line x1="680" y1="446" x2="724" y2="446" stroke="#bf4520" stroke-width="1.4" marker-end="url(#05-sibling-loops-arrow-accent)"/>
  <text x="736" y="450" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">END propagated</text>
</svg>

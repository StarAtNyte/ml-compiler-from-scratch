<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="06-gemm-views-title 06-gemm-views-desc">
  <title id="06-gemm-views-title">GEMM as movement ops on the (N, N, K) iteration space</title>
  <desc id="06-gemm-views-desc">A is reshaped to (N, 1, K) and B transposed and reshaped to (1, N, K); both are expanded to (N, N, K), multiplied elementwise, and the last axis is reduced to give C = A @ B.</desc>
  <defs>
    <marker id="06-gemm-views-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="06-gemm-views-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="40" y="24" width="880" height="340" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="56" y="46" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">ITERATION SPACE (i, j, k) = (N, N, K)</text>

  <!-- connectors (before boxes) -->
  <path d="M 204 92 L 400 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow)"/>
  <path d="M 204 276 L 236 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow)"/>
  <path d="M 368 276 L 400 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow)"/>
  <path d="M 620 92 L 708 92 Q 716 92 716 100 L 716 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow)"/>
  <path d="M 620 276 L 708 276 Q 716 276 716 268 L 716 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow)"/>
  <path d="M 772 184 L 800 184" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#06-gemm-views-arrow-accent)"/>

  <!-- labels -->

  <!-- nodes -->
  <rect x="64" y="64" width="140" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="64" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="134.0" y="88.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">A</text>
  <text x="134.0" y="106.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(N, K)</text>
  <rect x="400" y="64" width="220" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="64" width="220" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="510.0" y="88.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">reshape · expand</text>
  <text x="510.0" y="106.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(N, 1, K) → (N, N, K)</text>
  <rect x="64" y="248" width="140" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="248" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="134.0" y="272.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">B</text>
  <text x="134.0" y="290.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(K, N)</text>
  <rect x="236" y="248" width="132" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="236" y="248" width="132" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="302.0" y="272.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">permute</text>
  <text x="302.0" y="290.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(1, 0) · (N, K)</text>
  <rect x="400" y="248" width="220" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="400" y="248" width="220" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="510.0" y="272.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">reshape · expand</text>
  <text x="510.0" y="290.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(1, N, K) → (N, N, K)</text>
  <rect x="660" y="156" width="112" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="660" y="156" width="112" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="716.0" y="180.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">MUL</text>
  <text x="716.0" y="198.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(N, N, K)</text>
  <rect x="800" y="156" width="104" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="800" y="156" width="104" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="852.0" y="180.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">REDUCE</text>
  <text x="852.0" y="198.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">ADD, pop 1</text>

  <!-- annotations -->
  <text x="510" y="142" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">value at (i, j, k) = A[i, k]</text>
  <text x="510" y="326" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">value at (i, j, k) = B[k, j]</text>
  <text x="852" y="238" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">C (N, N)</text>
  <text x="64" y="400" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">the syllabus reshapes A to (N, N, 1) instead: the value at (i, j, k) is A[i, j],</text>
  <text x="64" y="420" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">so the sum over k is A · rowsum(B), not a matrix product</text>
</svg>

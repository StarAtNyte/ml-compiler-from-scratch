<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="08-movement-duals-title 08-movement-duals-desc">
  <title id="08-movement-duals-title">Movement ops and their gradient duals</title>
  <desc id="08-movement-duals-desc">Each movement op's gradient is its dual: a permute is undone by the inverse permute, an expand by a sum over the broadcast axes, a shrink by a zero pad, and a stack by indexing each slice.</desc>
  <defs>
    <marker id="08-movement-duals-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="08-movement-duals-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="24" y="24" width="912" height="420" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>

  <!-- connectors (before boxes) -->
  <path d="M 280 96 L 448 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 448 114 L 280 114" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 280 188 L 448 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 448 206 L 280 206" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#08-movement-duals-arrow-accent)"/>
  <path d="M 280 280 L 448 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 448 298 L 280 298" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 280 372 L 448 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-movement-duals-arrow)"/>
  <path d="M 448 390 L 280 390" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#08-movement-duals-arrow)"/>

  <!-- labels -->

  <!-- nodes -->
  <rect x="48" y="76" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="76" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="164.0" y="100.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">PERMUTE (1, 2, 0)</text>
  <text x="164.0" y="118.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(2, 3, 4) → (3, 4, 2)</text>
  <rect x="448" y="76" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="448" y="76" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="564.0" y="100.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">PERMUTE (2, 0, 1)</text>
  <text x="564.0" y="118.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(3, 4, 2) → (2, 3, 4)</text>
  <rect x="48" y="168" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="168" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="164.0" y="192.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">EXPAND</text>
  <text x="164.0" y="210.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(4, 1) → (4, 3)</text>
  <rect x="448" y="168" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="448" y="168" width="232" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="564.0" y="192.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">sum_to · REDUCE ADD</text>
  <text x="564.0" y="210.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">(4, 3) → (4, 1)</text>
  <rect x="48" y="260" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="260" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="164.0" y="284.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">SHRINK ((1, 3),)</text>
  <text x="164.0" y="302.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(5,) → (2,)</text>
  <rect x="448" y="260" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="448" y="260" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="564.0" y="284.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">PAD ((1, 2),)</text>
  <text x="564.0" y="302.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(2,) → (5,)</text>
  <rect x="48" y="352" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="352" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="164.0" y="376.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">STACK (a, b)</text>
  <text x="164.0" y="394.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">2 × (4,) → (2, 4)</text>
  <rect x="448" y="352" width="232" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="448" y="352" width="232" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="564.0" y="376.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">INDEX 0, INDEX 1</text>
  <text x="564.0" y="394.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(2, 4) → 2 × (4,)</text>

  <!-- annotations -->
  <text x="48" y="54" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">FORWARD · x → u</text>
  <text x="448" y="54" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">BACKWARD · g → dL/dx</text>
  <text x="712" y="54" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">WHY</text>
  <text x="712" y="100" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">the transpose of a permutation</text>
  <text x="712" y="118" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">is its inverse</text>
  <text x="712" y="192" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">one element feeds every copy:</text>
  <text x="712" y="210" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">the copies' gradients add up</text>
  <text x="712" y="284" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">dropped elements get zero</text>
  <text x="712" y="302" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">gradient</text>
  <text x="712" y="376" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">and INDEX of a constant ⇄</text>
  <text x="712" y="394" text-anchor="start" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#4f5d75">STACK with zeros</text>
  <text x="48" y="470" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">solid: op → its dual  ·  dashed: gradient flows back to x</text>
  <text x="912" y="470" text-anchor="end" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">also: RESHAPE ⇄ RESHAPE back, REDUCE ADD ⇄ EXPAND</text>
</svg>

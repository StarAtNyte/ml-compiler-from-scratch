  <text x="649.0" y="174" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" text-anchor="middle">new</text>
  <text x="649.0" y="210" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">7</text>
  <rect x="680" y="150" width="50" height="40" rx="4" fill="none" stroke="#5a6580" stroke-dasharray="4,3"/>
  <text x="705.0" y="210" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">8</text>
  <rect x="736" y="150" width="50" height="40" rx="4" fill="none" stroke="#5a6580" stroke-dasharray="4,3"/>
  <text x="761.0" y="210" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">9</text>
  <rect x="792" y="150" width="50" height="40" rx="4" fill="none" stroke="#5a6580" stroke-dasharray="4,3"/>
  <text x="817.0" y="210" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">10</text>
  <rect x="848" y="150" width="50" height="40" rx="4" fill="none" stroke="#5a6580" stroke-dasharray="4,3"/>
  <text x="873.0" y="210" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">11</text>
  <text x="40" y="258" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="start" font-weight="600">today</text>
  <text x="40" y="276" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75" text-anchor="start">mask, Tmax wide</text>
  <rect x="232" y="246" width="442" height="30" rx="4" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="453.0" y="266" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75" text-anchor="middle">softmax over slots 0 … pos</text>
  <rect x="680" y="246" width="218" height="30" rx="4" fill="none" stroke="#5a6580" stroke-dasharray="4,3"/>
  <text x="789.0" y="266" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">-1e9: computed, discarded</text>
  <text x="40" y="336" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" fill="#2d3142" text-anchor="start" font-weight="600">symbolic</text>
  <text x="40" y="354" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75" text-anchor="start">RANGE(end = pos + 1)</text>
  <rect x="232" y="324" width="442" height="30" rx="4" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="453.0" y="344" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75" text-anchor="middle">loop j &lt; pos + 1</text>
  <text x="789.0" y="344" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" text-anchor="middle">never touched</text>
  <text x="40" y="412" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75" text-anchor="start">Per token: Θ(Tmax·D) work with a mask; Θ(pos·D) with a symbolic loop end.</text>
</svg>

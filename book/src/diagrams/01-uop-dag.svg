<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" role="img" aria-labelledby="01-uop-dag-title 01-uop-dag-desc">
  <title id="01-uop-dag-title">The UOp DAG for (a + b) * (a + b) + 1.0</title>
  <desc id="01-uop-dag-desc">The expression is five UOps: two PARAMs, one ADD that is shared by both sources of the MUL, the MUL, and a root ADD with a constant; arrows point from each node to its sources.</desc>
  <defs>
    <marker id="01-uop-dag-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="01-uop-dag-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="32" y="48" width="320" height="184" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="48" y="70" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">TO_UIR(E)</text>
  <text x="56" y="104" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">%0 = param : slot=0 dtype=f32</text>
  <text x="56" y="128" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">%1 = param : slot=1 dtype=f32</text>
  <text x="56" y="152" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">%2 = add %0, %1</text>
  <text x="56" y="176" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">%3 = mul %2, %2</text>
  <text x="56" y="200" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">%4 = add %3, 1.0</text>
  <g>
  <path d="M600 104 V166" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  <path d="M700 76 H796 A8 8 0 0 1 804 84 V166" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  <path d="M560 224 V286" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  <path d="M640 224 V286" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  <path d="M520 344 V406" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  <path d="M680 344 V406" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-uop-dag-arrow)"/>
  </g>
  <rect x="507.08" y="248" width="48.92" height="16" rx="2" fill="#f5f5f5"/>
  <text x="552" y="260" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">src[0]</text>
  <rect x="644" y="248" width="48.92" height="16" rx="2" fill="#f5f5f5"/>
  <text x="648" y="260" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">src[1]</text>
  <rect x="500" y="48" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="48" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="73" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">%4 add</text>
  <text x="600" y="90" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">f32 · shape ()</text>
  <rect x="500" y="168" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="168" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="193" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">%3 mul</text>
  <text x="600" y="210" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">f32 · shape ()</text>
  <rect x="740" y="168" width="128" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="740" y="168" width="128" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="804" y="193" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">const</text>
  <text x="804" y="210" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1.0 · f32</text>
  <rect x="500" y="288" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="288" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="600" y="313" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">%2 add</text>
  <text x="600" y="330" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">f32 · shape ()</text>
  <rect x="450" y="408" width="140" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="450" y="408" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="520" y="433" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">%0 param</text>
  <text x="520" y="450" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">slot=0 · f32</text>
  <rect x="610" y="408" width="140" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="610" y="408" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="680" y="433" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">%1 param</text>
  <text x="680" y="450" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">slot=1 · f32</text>
  <text x="724" y="312" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">built once,</text>
  <text x="724" y="332" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">used twice</text>
  <text x="40" y="284" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">repr(e) prints it as a tree:</text>
  <text x="40" y="304" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">%2 twice, a and b twice each</text>
  <text x="40" y="352" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">arrows follow src pointers:</text>
  <text x="40" y="370" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">user → source</text>
</svg>

  <title id="02-bottom-up-title">Bottom-up rewrite order</title>
  <desc id="02-bottom-up-desc">The expression (p0 + 2) * 3 + (1 + 4) as a tree with each node numbered in the order graph_rewrite visits it; the MUL, the inner ADD of constants and the root each match a rule, and their results are visited before moving on.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="gpt-arch-title gpt-arch-desc">
  <title id="gpt-arch-title">The GPT of examples/gpt.py</title>
  <desc id="gpt-arch-desc">Token ids are embedded by a one-hot matmul plus a position table into a residual stream of shape B by T by C. Each of L blocks adds a causal self-attention branch and an MLP branch, each behind a LayerNorm. A final LayerNorm and a linear head produce logits of shape B by T by V, scored with cross-entropy.</desc>
  <defs><marker id="gpt-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="104" y="140" width="640" height="320" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="728" y="162" text-anchor="end" font-size="11" fill="#5a6580" letter-spacing="0.12em" font-family="Geist Mono, JetBrains Mono, monospace">BLOCK × L</text>
  <line x1="200" y1="116" x2="200" y2="262" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
  <line x1="200" y1="278" x2="200" y2="412" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
  <line x1="200" y1="428" x2="200" y2="496" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="200" y1="204" x2="256" y2="204" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="420" y1="204" x2="456" y2="204" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <path d="M 580 232 L 580 262 Q 580 270 572 270 L 212 270" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="200" y1="334" x2="256" y2="334" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="420" y1="334" x2="456" y2="334" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <path d="M 580 362 L 580 412 Q 580 420 572 420 L 212 420" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="290" y1="528" x2="326" y2="528" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <line x1="490" y1="528" x2="526" y2="528" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#gpt-arch-arrow)"/>
  <circle cx="200" cy="270" r="8" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="200" y="274" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">+</text>
  <circle cx="200" cy="420" r="8" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="200" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">+</text>
  <rect x="80" y="60" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="200.0" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Embed</text>
  <text x="200.0" y="102" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">one_hot(idx) @ W + pos → (B,T,C)</text>
  <rect x="260" y="176" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="340.0" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">LayerNorm 1</text>
  <text x="340.0" y="218" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">(B,T,C)</text>
  <rect x="460" y="176" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="580.0" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Causal attention</text>
  <text x="580.0" y="218" text-anchor="middle" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">H heads of D · (B,T,C)</text>
  <rect x="260" y="306" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="340.0" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">LayerNorm 2</text>
  <text x="340.0" y="348" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">(B,T,C)</text>
  <rect x="460" y="306" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="580.0" y="330" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">MLP</text>
  <text x="580.0" y="348" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">C → 4C → GELU → C</text>
  <rect x="110" y="500" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="200.0" y="524" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">LayerNorm</text>
  <text x="200.0" y="542" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">final · (B,T,C)</text>
  <rect x="330" y="500" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="410.0" y="524" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Head</text>
  <text x="410.0" y="542" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">Linear C → V</text>
  <rect x="530" y="500" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="630.0" y="524" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Cross-entropy</text>
  <text x="630.0" y="542" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">(B,T,V) logits → ()</text>
  <text x="216" y="300" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">residual</text>
  <text x="772" y="196" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">B = 16  batch</text>
  <text x="772" y="216" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">T = 64  context</text>
  <text x="772" y="236" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">C = 64  width</text>
  <text x="772" y="256" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">H = 4   heads</text>
  <text x="772" y="276" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">D = 16  head dim</text>
  <text x="772" y="296" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">V = 65  vocab</text>
  <text x="772" y="316" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">L = 2   blocks</text>
  <text x="772" y="336" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve"></text>
  <text x="772" y="356" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">112.6k parameters</text>
</svg>

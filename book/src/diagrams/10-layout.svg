  <rect x="688" y="222" width="82" height="28" fill="#ffffff" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>
  <rect x="772" y="222" width="82" height="28" fill="#ffffff" stroke="rgba(45,49,66,0.45)" stroke-width="0.8"/>

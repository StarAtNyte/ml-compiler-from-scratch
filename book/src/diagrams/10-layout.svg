  <rect x="184" y="328" width="6" height="20" fill="#bf4520"/>
  <line x1="44" y1="120" x2="44" y2="350" stroke="#bf4520" stroke-width="1.4" marker-end="url(#lay-arrow)"/>
  <text x="36" y="132" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">k</text>
  <text x="60" y="388" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">stride N*4 = 4096 B per k-step:</text>
  <text x="60" y="406" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">a new 64 B line AND a new 4 KB page,</text>
  <text x="60" y="424" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">no vector load can run along k</text>
  <text x="404" y="138.0" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">one row = 4 KB</text>
  <text x="520" y="66" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Bᵀ · row-major (N, K)</text>
  <text x="520" y="86" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">reduce over k walks ALONG row j</text>

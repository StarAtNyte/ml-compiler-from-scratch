<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="lay-title lay-desc">
  <title id="lay-title">Strided versus contiguous reduce axis</title>
  <desc id="lay-desc">Left: B stored row-major as K by N; the GEMM reduce walks down column j, so consecutive k are 4096 bytes apart and every step touches a new 64-byte cache line and a new 4 KB page, using 4 of its 64 bytes. Right: B transposed stored as N by K; the reduce walks along row j, consecutive k are adjacent, one cache line serves 16 steps and one 8-wide vector load serves 8.</desc>
  <defs><marker id="lay-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="60" y="66" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">B · row-major (K, N)</text>
  <text x="60" y="86" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">reduce over k walks DOWN column j</text>

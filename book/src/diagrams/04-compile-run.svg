<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="04-compile-run-title 04-compile-run-desc">
  <title id="04-compile-run-title">From C source to a call</title>
  <desc id="04-compile-run-desc">The runtime hashes the C source with the compiler and flags; on a cache miss gcc builds a shared object in a temporary directory inside the cache and atomically renames it into place; then ctypes loads the shared object and calls the kernel with raw numpy data pointers.</desc>
  <defs>
    <marker id="04-compile-run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zone: cache miss path -->
  <rect x="540" y="200" width="280" height="240" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="560" y="224" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">CACHE MISS ONLY</text>

  <!-- connectors -->
  <g stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#04-compile-run-arrow)">
    <line x1="310" y1="96" x2="310" y2="138"/>
    <line x1="310" y1="196" x2="310" y2="226"/>
    <line x1="400" y1="268" x2="558" y2="268"/>
    <line x1="310" y1="308" x2="310" y2="358"/>
    <line x1="680" y1="296" x2="680" y2="358"/>
    <line x1="570" y1="388" x2="432" y2="388"/>
    <line x1="310" y1="416" x2="310" y2="458"/>
  </g>
  <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">
    <rect x="460" y="244" width="40" height="14" rx="2" fill="#f5f5f5"/>
    <text x="480" y="255" text-anchor="middle">NO</text>
    <rect x="320" y="326" width="40" height="14" rx="2" fill="#f5f5f5"/>
    <text x="340" y="337" text-anchor="middle">YES</text>
  </g>

  <g font-family="Geist, Inter, system-ui, sans-serif" text-anchor="middle">
    <rect x="190" y="40" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="310" y="64" font-size="14" font-weight="600" fill="#2d3142">render_c(sink)</text>
    <text x="310" y="82" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">deterministic C source</text>

    <rect x="190" y="140" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="310" y="164" font-size="14" font-weight="600" fill="#2d3142">Cache key</text>
    <text x="310" y="182" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">sha256(src, CC, flags)[:24]</text>

    <polygon points="310,228 400,268 310,308 220,268" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="310" y="265" font-size="13" font-weight="600" fill="#2d3142">key.so</text>
    <text x="310" y="281" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">exists?</text>

    <rect x="560" y="240" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="680" y="264" font-size="14" font-weight="600" fill="#2d3142">gcc, in a temp dir</text>
    <text x="680" y="282" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">-O3 … -shared -fPIC -lm</text>

    <rect x="570" y="360" width="220" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="680" y="384" font-size="14" font-weight="600" fill="#2d3142">os.replace</text>
    <text x="680" y="402" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">atomic, same filesystem</text>

    <rect x="190" y="360" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="310" y="384" font-size="14" font-weight="600" fill="#2d3142">ctypes.CDLL</text>
    <text x="310" y="402" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">dlopen + symbol lookup</text>

    <rect x="190" y="460" width="240" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="310" y="484" font-size="14" font-weight="600" fill="#2d3142">Call the kernel</text>
    <text x="310" y="502" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">fn(c_void_p(a.ctypes.data), …)</text>
  </g>

  <text x="560" y="484" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">a warm cache costs one stat() call;</text>
  <text x="560" y="504" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">a cold one, tens of milliseconds of gcc</text>
</svg>

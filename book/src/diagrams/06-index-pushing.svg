<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="06-index-pushing-title 06-index-pushing-desc">
  <title id="06-index-pushing-title">An index flowing down through movement ops</title>
  <desc id="06-index-pushing-desc">Rangeify asks the root for its value at (i, j); each movement op rewrites the index on its way down until it reaches a buffer as a flat load address.</desc>
  <defs>
    <marker id="06-index-pushing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="06-index-pushing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="40" y="24" width="880" height="556" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="56" y="46" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">INDEX FLOWS DOWN · VALUES FLOW UP</text>

  <!-- connectors (before boxes) -->
  <path d="M 450 96 L 450 112 Q 450 120 442 120 L 288 120 Q 280 120 280 128 L 280 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>
  <path d="M 510 96 L 510 112 Q 510 120 518 120 L 692 120 Q 700 120 700 128 L 700 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>
  <path d="M 280 208 L 280 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>
  <path d="M 280 320 L 280 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>
  <path d="M 280 432 L 280 488" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow-accent)"/>
  <path d="M 700 208 L 700 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>
  <path d="M 700 320 L 700 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-index-pushing-arrow)"/>

  <!-- labels -->
  <rect x="288.0" y="130" width="48.9" height="17" rx="2" fill="#f5f5f5"/>
  <text x="292" y="142" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(i, j)</text>
  <rect x="708.0" y="130" width="48.9" height="17" rx="2" fill="#f5f5f5"/>
  <text x="712" y="142" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(i, j)</text>
  <rect x="288.0" y="228" width="62.6" height="17" rx="2" fill="#f5f5f5"/>
  <text x="292" y="240" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(i+1, j)</text>
  <rect x="288.0" y="340" width="62.6" height="17" rx="2" fill="#f5f5f5"/>
  <text x="292" y="352" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(j, i+1)</text>
  <rect x="288.0" y="452" width="83.0" height="17" rx="2" fill="#f5f5f5"/>
  <text x="292" y="464" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.04em">j*4 + i + 1</text>
  <rect x="708.0" y="228" width="48.9" height="17" rx="2" fill="#f5f5f5"/>
  <text x="712" y="240" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(0, j)</text>
  <rect x="708.0" y="340" width="28.5" height="17" rx="2" fill="#f5f5f5"/>
  <text x="712" y="352" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.04em">(j)</text>

  <!-- nodes -->
  <rect x="380" y="40" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="380" y="40" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="480.0" y="64.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">MUL</text>
  <text x="480.0" y="82.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">out[i, j]  ·  (2, 3)</text>
  <rect x="180" y="152" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="180" y="152" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="280.0" y="176.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">SHRINK</text>
  <text x="280.0" y="194.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">((1,3), (0,3)) · (2, 3)</text>
  <rect x="180" y="264" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="180" y="264" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="280.0" y="288.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">PERMUTE</text>
  <text x="280.0" y="306.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(1, 0) · (4, 3)</text>
  <rect x="180" y="376" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="180" y="376" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="280.0" y="400.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">RESHAPE</text>
  <text x="280.0" y="418.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(3, 4)</text>
  <rect x="180" y="488" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="180" y="488" width="200" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="280.0" y="512.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">BUFFER x</text>
  <text x="280.0" y="530.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">data0 · (12,)</text>
  <rect x="600" y="152" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="152" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="700.0" y="176.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">EXPAND</text>
  <text x="700.0" y="194.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(1, 3) → (2, 3)</text>
  <rect x="600" y="264" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="264" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="700.0" y="288.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">RESHAPE</text>
  <text x="700.0" y="306.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(3,) → (1, 3)</text>
  <rect x="600" y="376" width="200" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="376" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="700.0" y="400.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">BUFFER b</text>
  <text x="700.0" y="418.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">data1 · (3,)</text>

  <!-- annotations -->
  <text x="560" y="504" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">five movement ops, zero copies:</text>
  <text x="560" y="524" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">the C reads data0[(i + j*4) + 1]</text>
</svg>

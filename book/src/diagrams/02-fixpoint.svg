<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="02-fixpoint-title 02-fixpoint-desc">
  <title id="02-fixpoint-title">The three stages of graph_rewrite</title>
  <desc id="02-fixpoint-desc">Each node popped from the work stack first schedules its sources, then is rebuilt and matched against the rules; if a rule fires, its result is pushed and rewritten from stage 0, and stage 2 records that result's normal form as the node's answer.</desc>
  <defs>
    <marker id="02-fixpoint-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="02-fixpoint-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <path d="M116 28 V78" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-fixpoint-arrow)"/>
  <rect x="120" y="44" width="103.48" height="16" rx="2" fill="#f5f5f5"/>
  <text x="124" y="56" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">POP (u, stage)</text>
  <path d="M200 108 H290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-fixpoint-arrow)"/>
  <rect x="211.31" y="82" width="69.38" height="16" rx="2" fill="#f5f5f5"/>
  <text x="246" y="94" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">SRCS DONE</text>
  <path d="M460 108 H502" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-fixpoint-arrow)"/>
  <path d="M656 108 H718" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-fixpoint-arrow)"/>
  <rect x="676.18" y="82" width="21.64" height="16" rx="2" fill="#f5f5f5"/>
  <text x="687" y="94" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">NO</text>
  <path d="M580 152 V218" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-fixpoint-arrow)"/>
  <rect x="584" y="178" width="28.46" height="16" rx="2" fill="#f5f5f5"/>
  <text x="588" y="190" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">YES</text>
  <path d="M664 248 H718" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#02-fixpoint-arrow)"/>
  <rect x="669.95" y="222" width="42.1" height="16" rx="2" fill="#f5f5f5"/>
  <text x="691" y="234" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">LATER</text>
  <path d="M496 248 H124 A8 8 0 0 1 116 240 V138" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#02-fixpoint-arrow-accent)"/>
  <rect x="220.98" y="222" width="158.04" height="16" rx="2" fill="#f5f5f5"/>
  <text x="300" y="234" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.06em">REWRITE m FROM STAGE 0</text>
  <rect x="32" y="80" width="168" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="80" width="168" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="116" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">stage 0</text>
  <text x="116" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">push (u,1), sources</text>
  <rect x="292" y="80" width="168" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="292" y="80" width="168" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="376" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">stage 1</text>
  <text x="376" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">rebuild, try rules</text>
  <polygon points="580,64 656,108 580,152 504,108" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="580" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#2d3142" font-weight="600">rule fired?</text>
  <text x="580" y="121" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" fill="#4f5d75">pm.rewrite(n)</text>
  <rect x="720" y="80" width="184" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="80" width="184" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="812" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">normal form</text>
  <text x="812" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">done[u] = n</text>
  <rect x="496" y="220" width="168" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="496" y="220" width="168" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="580" y="245" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">schedule m</text>
  <text x="580" y="262" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">push (u,2,m), (m,0)</text>
  <rect x="720" y="220" width="184" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="220" width="184" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="812" y="245" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">stage 2</text>
  <text x="812" y="262" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">done[u] = done[m]</text>
  <text x="32" y="316" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">a rule's output is just another node:</text>
  <text x="32" y="336" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">it goes through the same three stages</text>
  <text x="720" y="316" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">if m is already done,</text>
  <text x="720" y="336" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">done[u] = done[m] at once</text>
</svg>

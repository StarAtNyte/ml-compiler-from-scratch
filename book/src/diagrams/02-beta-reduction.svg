<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-labelledby="02-beta-reduction-title 02-beta-reduction-desc">
  <title id="02-beta-reduction-title">Scoped CALL inlining</title>
  <desc id="02-beta-reduction-desc">Inlining CALL g replaces the shared PARAM p0 with g's argument only along edges in g's own body, such as the argument of the nested CALL sq, and never inside sq's body, even though both bodies use the very same p0 node.</desc>
  <defs>
    <marker id="02-beta-reduction-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="02-beta-reduction-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="32" y="128" width="508" height="176" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="524" y="150" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">g BODY · SUBSTITUTED</text>
  <rect x="240" y="328" width="300" height="120" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="524" y="350" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">sq BODY · NOT ENTERED</text>
  <path d="M420 88 V112 A8 8 0 0 1 412 120 H152 A8 8 0 0 0 144 128 V174" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M480 88 V112 A8 8 0 0 0 488 120 H668 A8 8 0 0 1 676 128 V174" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M224 204 H262" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M320 232 V366" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M384 232 V272 A8 8 0 0 0 392 280 H608 A8 8 0 0 1 616 288 V366" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#02-beta-reduction-arrow-accent)"/>
  <rect x="444.85" y="256" width="110.3" height="16" rx="2" fill="#f5f5f5"/>
  <text x="500" y="268" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.06em">p0 → add(p0, 1)</text>
  <path d="M676 232 V366" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M424 384 H590" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <path d="M424 408 H590" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#02-beta-reduction-arrow)"/>
  <rect x="126.36" y="96" width="35.28" height="16" rx="2" fill="#f5f5f5"/>
  <text x="144" y="108" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">BODY</text>
  <rect x="545.77" y="96" width="28.46" height="16" rx="2" fill="#f5f5f5"/>
  <text x="560" y="108" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">ARG</text>
  <rect x="360" y="32" width="180" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="360" y="32" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="450" y="57" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">CALL g</text>
  <text x="450" y="74" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">src = (body, arg)</text>
  <rect x="64" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="176" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="144" y="201" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">mul</text>
  <text x="144" y="218" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">src[1] = 2</text>
  <rect x="264" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="264" y="176" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="344" y="201" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">CALL sq</text>
  <text x="344" y="218" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">src = (body, arg)</text>
  <rect x="592" y="176" width="168" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="592" y="176" width="168" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="676" y="201" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">add</text>
  <text x="676" y="218" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">p0 + 1 · g's arg</text>
  <rect x="264" y="368" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="264" y="368" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="344" y="393" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">mul</text>
  <text x="344" y="410" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">p0 · p0</text>
  <rect x="592" y="368" width="140" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="592" y="368" width="140" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="662" y="393" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">p0</text>
  <text x="662" y="410" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">PARAM slot=0</text>
  <text x="560" y="456" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">p0 is one object,</text>
  <text x="560" y="476" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">shared by both scopes</text>
  <text x="32" y="452" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">inline_call(g) rewrites only</text>
  <text x="32" y="472" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">the accent edge</text>
</svg>

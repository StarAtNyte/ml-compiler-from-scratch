<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">The uopc compiler pipeline</title>
  <desc id="pipeline-desc">Tensor code becomes a shape graph, gets differentiated and cut into kernels, each kernel is optimized and rangeified into loops, simplified and linearized, then rendered to C or CUDA, compiled and executed.</desc>
  <defs>
    <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="40" y="40" width="880" height="132" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <rect x="40" y="200" width="880" height="132" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <rect x="40" y="360" width="880" height="132" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">
    <text x="60" y="64">FRONTEND · WEEKS 1, 5</text>
    <text x="60" y="224">LOWERING · WEEKS 4, 6</text>
    <text x="900" y="384" text-anchor="end">BACKEND · WEEKS 2–3, 7–8</text>
  </g>

  <!-- connectors (drawn before boxes) -->
  <g stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#pipeline-arrow)">
    <line x1="244" y1="112" x2="274" y2="112"/>
    <line x1="456" y1="112" x2="486" y2="112"/>
    <line x1="668" y1="112" x2="698" y2="112"/>
    <line x1="788" y1="140" x2="788" y2="230"/>
    <line x1="700" y1="272" x2="670" y2="272"/>
    <line x1="488" y1="272" x2="458" y2="272"/>
    <line x1="276" y1="272" x2="246" y2="272"/>
    <line x1="152" y1="300" x2="152" y2="390"/>
    <line x1="244" y1="432" x2="274" y2="432"/>
    <line x1="456" y1="432" x2="486" y2="432"/>
  </g>

  <!-- row 1 -->
  <g font-family="Geist, Inter, system-ui, sans-serif">
    <rect x="64" y="84" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="154" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Tensor API</text>
    <text x="154" y="126" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">tensor.py · nn.py</text>

    <rect x="276" y="84" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="366" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Shape graph</text>
    <text x="366" y="126" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">uop.py · .uir</text>

    <rect x="488" y="84" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="578" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Autodiff</text>
    <text x="578" y="126" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">autodiff.py</text>

    <rect x="700" y="84" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="790" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Kernelize</text>
    <text x="790" y="126" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">kernelize.py · STAGE</text>

    <!-- row 2 (flows right to left) -->
    <rect x="700" y="244" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="790" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Layout + opts</text>
    <text x="790" y="286" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">opt.py · UPCAST</text>

    <rect x="488" y="244" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="578" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Rangeify</text>
    <text x="578" y="286" text-anchor="middle" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">shapes → loops</text>

    <rect x="276" y="244" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="366" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Symbolic</text>
    <text x="366" y="286" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">symbolic.py · rewrite.py</text>

    <rect x="64" y="244" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="154" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Linearize</text>
    <text x="154" y="286" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">linearize.py</text>

    <!-- row 3 -->
    <rect x="64" y="404" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="154" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Render</text>
    <text x="154" y="446" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">render_c.py · gpu.py</text>

    <rect x="276" y="404" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="366" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Compile</text>
    <text x="366" y="446" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">gcc · nvrtc</text>

    <rect x="488" y="404" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
    <text x="578" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3142">Execute</text>
    <text x="578" y="446" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">runtime.py · cuda.py</text>
  </g>

  <!-- editorial callout -->
  <text x="712" y="436" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">schedules are cached:</text>
  <text x="712" y="456" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">step 2 only executes</text>
</svg>

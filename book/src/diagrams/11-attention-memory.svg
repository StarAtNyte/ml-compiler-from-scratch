<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-labelledby="attm-title attm-desc">
  <title id="attm-title">Memory traffic of unfused versus online attention</title>
  <desc id="attm-desc">Unfused attention at N = 1024, D = 64 runs six kernels and materializes two N by N buffers, the scores S and the probabilities P, 4.2 MB each, making six passes over N by N floats. Online attention runs one kernel that keeps a running max m, running sum l and a D-element accumulator per query row, and touches only Q, K, V and O, 256 KB each.</desc>
  <defs><marker id="attm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect x="24" y="40" width="912" height="176" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <rect x="24" y="244" width="912" height="176" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="44" y="64" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">UNFUSED · 6 KERNELS · 6 PASSES OVER N×N FLOATS</text>
  <text x="44" y="268" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">ONLINE SOFTMAX · 1 KERNEL · NOTHING N×N IN MEMORY</text>
  <line x1="196" y1="144.0" x2="222" y2="144.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <line x1="380" y1="144.0" x2="406" y2="144.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <line x1="564" y1="144.0" x2="590" y2="144.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <line x1="748" y1="144.0" x2="774" y2="144.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <rect x="44" y="112" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
  <text x="120.0" y="139" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Q, K, V</text>
  <text x="120.0" y="158" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">3 × 256 KB</text>
  <rect x="228" y="112" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="304.0" y="139" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">S = QKᵀ/√D</text>
  <text x="304.0" y="158" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">N×N · 4.2 MB</text>
  <rect x="412" y="112" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="488.0" y="139" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">row max, row Σ</text>
  <text x="488.0" y="158" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">2 kernels · reread S</text>
  <rect x="596" y="112" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="672.0" y="139" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">P = softmax</text>
  <text x="672.0" y="158" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">N×N · 4.2 MB</text>
  <rect x="780" y="112" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="856.0" y="139" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">O = P V</text>
  <text x="856.0" y="158" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">256 KB</text>
  <text x="228" y="200" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">S: 1 write + 3 reads</text>
  <text x="596" y="200" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">P: 1 write + 1 read</text>
  <line x1="196" y1="332.0" x2="406" y2="332.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <line x1="748" y1="332.0" x2="774" y2="332.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#attm-arrow)"/>
  <rect x="44" y="300" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
  <text x="120.0" y="327" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">Q, K, V</text>
  <text x="120.0" y="346" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">3 × 256 KB</text>
  <rect x="412" y="300" width="336" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="580" y="327" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">flash kernel: one pass over keys</text>
  <text x="580" y="346" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">per query row: m, l, o[D] on the stack</text>
  <rect x="780" y="300" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="856.0" y="327" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">O</text>
  <text x="856.0" y="346" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">256 KB</text>
  <text x="44" y="390" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">K and V (512 KB) are re-read for every query row, from cache</text>
</svg>

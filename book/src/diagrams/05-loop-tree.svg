<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="05-loop-tree-title 05-loop-tree-desc">
  <title id="05-loop-tree-title">Scopes as paths in the loop tree</title>
  <desc id="05-loop-tree-desc">In GEMM the loops form one path i, j, k, so a load whose scope is {i, k} is placed on the path i, j, k; in the row-max kernel the reduction loop k and output loop j are siblings under i, ordered by the END of k.</desc>
  <defs>
    <marker id="05-loop-tree-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="05-loop-tree-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <!-- connectors -->
  <path d="M130,108 V148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M130,198 V238" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M130,288 V328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M710,108 V148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M690,198 V214 Q690,222 682,222 H618 Q610,222 610,230 V258" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M730,198 V214 Q730,222 738,222 H822 Q830,222 830,230 V258" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#05-loop-tree-arrow)"/>
  <path d="M680,284 H758" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#05-loop-tree-arrow-accent)"/>
  <rect x="691" y="259" width="56" height="15" rx="2" fill="#f5f5f5"/>
  <text x="719" y="270" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.06em">END k</text>
  <!-- nodes -->
  <rect x="60" y="60" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="130" y="89" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">kernel</text>
  <rect x="60" y="150" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="130" y="179" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop i</text>
  <rect x="60" y="240" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="130" y="269" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop j</text>
  <rect x="60" y="330" width="140" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="130" y="359" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop k</text>
  <rect x="640" y="60" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="89" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">kernel</text>
  <rect x="640" y="150" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="710" y="179" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop i</text>
  <rect x="540" y="260" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="610" y="289" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop k</text>
  <rect x="760" y="260" width="140" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="830" y="289" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" fill="#2d3142">loop j</text>
  <text x="40" y="40" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">GEMM · ONE PATH</text>
  <text x="520" y="40" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">ROW MAX · SIBLINGS UNDER i</text>
  <line x1="480" y1="28" x2="480" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="220" y="170" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">i*K: scope {i}</text>
  <text x="220" y="188" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">→ placed at i</text>
  <text x="220" y="260" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">acc reset, C store:</text>
  <text x="220" y="278" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">scope {i, j} → i/j</text>
  <text x="220" y="344" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">A[i*K+k]: scope {i, k}</text>
  <text x="220" y="362" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">closed → i/j/k</text>
  <text x="220" y="392" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">B[k*M+j]: scope {j, k}</text>
  <text x="220" y="410" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">closed → i/j/k</text>
  <text x="610" y="336" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">max over x[i, k]</text>
  <text x="610" y="354" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">target i/k</text>
  <text x="830" y="336" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">x[i, j] - max</text>
  <text x="830" y="354" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">target i/j</text>
  <text x="520" y="412" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">j and k never share a scope, so neither encloses</text>
  <text x="520" y="434" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">the other; only the END decides which runs first</text>
</svg>

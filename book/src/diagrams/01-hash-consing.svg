<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="01-hash-consing-title 01-hash-consing-desc">
  <title id="01-hash-consing-title">Hash consing in UOp.__new__</title>
  <desc id="01-hash-consing-desc">Constructing a UOp builds a key from its op, sources and type-tagged arg and looks it up in a weak cache; on a hit the existing object is returned, on a miss the node is type checked, inserted and returned.</desc>
  <defs>
    <marker id="01-hash-consing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="01-hash-consing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <path d="M212 108 H254" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-hash-consing-arrow)"/>
  <path d="M444 108 H482" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-hash-consing-arrow)"/>
  <path d="M636 108 H702" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#01-hash-consing-arrow-accent)"/>
  <path d="M560 152 V198" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-hash-consing-arrow)"/>
  <path d="M650 228 H702" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-hash-consing-arrow)"/>
  <path d="M796 256 V310" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-hash-consing-arrow)"/>
  <polygon points="560,64 636,108 560,152 484,108" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="560" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#2d3142" font-weight="600">in cache?</text>
  <text x="560" y="121" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" fill="#4f5d75">cache.get(key)</text>
  <rect x="654.77" y="82" width="28.46" height="16" rx="2" fill="#f5f5f5"/>
  <text x="669" y="94" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520" letter-spacing="0.06em">HIT</text>
  <rect x="564" y="168" width="35.28" height="16" rx="2" fill="#f5f5f5"/>
  <text x="568" y="180" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.06em">MISS</text>
  <rect x="32" y="80" width="180" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="32" y="80" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="122" y="105" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">UOp(op, src, arg)</text>
  <text x="122" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">construct</text>
  <rect x="256" y="80" width="188" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="256" y="80" width="188" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="350" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">build the key</text>
  <text x="350" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">(op, src, _argkey(arg))</text>
  <rect x="704" y="80" width="184" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="704" y="80" width="184" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="796" y="105" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">return cached</text>
  <text x="796" y="122" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">the same object</text>
  <rect x="470" y="200" width="180" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="470" y="200" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="560" y="225" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">_infer</text>
  <text x="560" y="242" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">dtype, shape, addrspace</text>
  <rect x="704" y="200" width="184" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="704" y="200" width="184" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="796" y="225" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">insert</text>
  <text x="796" y="242" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">_cache[key] = u (weak)</text>
  <rect x="704" y="312" width="184" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="704" y="312" width="184" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="796" y="337" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">return new</text>
  <text x="796" y="354" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">u</text>
  <rect x="32" y="184" width="400" height="200" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="48" y="206" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">_ARGKEY(ARG)</text>
  <text x="56" y="236" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">CONST 1</text>
  <text x="196" y="236" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#4f5d75">→  (int, 1)</text>
  <text x="56" y="262" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">CONST 1.0</text>
  <text x="196" y="262" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#4f5d75">→  (float, '1.0')</text>
  <text x="56" y="288" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">CONST True</text>
  <text x="196" y="288" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#4f5d75">→  (bool, True)</text>
  <text x="56" y="314" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">CONST -0.0</text>
  <text x="196" y="314" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#4f5d75">→  (float, '-0.0')</text>
  <text x="56" y="340" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">CONST nan</text>
  <text x="196" y="340" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#4f5d75">→  (float, 'nan')</text>
  <text x="470" y="300" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">a type error raises here,</text>
  <text x="470" y="320" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-size="16" fill="#4f5d75" font-style="italic">so nothing ill-typed is cached</text>
</svg>

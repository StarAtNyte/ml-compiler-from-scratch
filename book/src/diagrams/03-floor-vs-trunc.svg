<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="03-floor-vs-trunc-title 03-floor-vs-trunc-desc">
  <title id="03-floor-vs-trunc-title">Floor division versus truncating division by 4</title>
  <desc id="03-floor-vs-trunc-desc">Integers from -8 to 7 grouped by their quotient when divided by 4. Floor division groups them in buckets of exactly four integers; C truncating division has one bucket of seven integers, from -3 to 3, that all map to zero.</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="24" y="40" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">QUOTIENT OF x BY 4, FOR x = −8 … 7</text>
  <text x="24" y="86" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">floor</text>
  <text x="24" y="102" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">x // 4 (IR)</text>
  <rect x="120" y="64" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="212" y="85" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">−2</text>
  <text x="212" y="100" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <rect x="312" y="64" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="404" y="85" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">−1</text>
  <text x="404" y="100" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <rect x="504" y="64" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="596" y="85" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">0</text>
  <text x="596" y="100" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <rect x="696" y="64" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="788" y="85" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">1</text>
  <text x="788" y="100" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <line x1="116" y1="152" x2="884" y2="152" stroke="#4f5d75" stroke-width="1.2"/>
  <line x1="140" y1="146" x2="140" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="140" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−8</text>
  <line x1="188" y1="146" x2="188" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="188" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−7</text>
  <line x1="236" y1="146" x2="236" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="236" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−6</text>
  <line x1="284" y1="146" x2="284" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="284" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−5</text>
  <line x1="332" y1="146" x2="332" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="332" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−4</text>
  <line x1="380" y1="146" x2="380" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="380" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−3</text>
  <line x1="428" y1="146" x2="428" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="428" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−2</text>
  <line x1="476" y1="146" x2="476" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="476" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">−1</text>
  <line x1="524" y1="146" x2="524" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="524" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">0</text>
  <line x1="572" y1="146" x2="572" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="572" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <line x1="620" y1="146" x2="620" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="620" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">2</text>
  <line x1="668" y1="146" x2="668" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="668" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">3</text>
  <line x1="716" y1="146" x2="716" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="716" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">4</text>
  <line x1="764" y1="146" x2="764" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="764" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">5</text>
  <line x1="812" y1="146" x2="812" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="812" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">6</text>
  <line x1="860" y1="146" x2="860" y2="158" stroke="#4f5d75" stroke-width="1"/>
  <text x="860" y="178" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">7</text>
  <text x="24" y="156" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">x</text>
  <text x="24" y="222" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">truncate</text>
  <text x="24" y="238" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">x / 4 (C)</text>
  <rect x="120" y="200" width="40" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="140" y="221" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">−2</text>
  <text x="140" y="236" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580"></text>
  <rect x="168" y="200" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="260" y="221" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">−1</text>
  <text x="260" y="236" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <rect x="360" y="200" width="328" height="44" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="524" y="221" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">0</text>
  <text x="524" y="236" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">7 values</text>
  <rect x="696" y="200" width="184" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
  <text x="788" y="221" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">1</text>
  <text x="788" y="236" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">4 values</text>
  <text x="140" y="296" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">Floor shifts by whole buckets: (a·4 + b) // 4 = a + b // 4 for every b.</text>
  <text x="140" y="318" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">Truncation’s seven-wide zero bucket breaks that rule whenever b &lt; 0.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="perf-ablation-title perf-ablation-desc">
  <title id="perf-ablation-title">GPT step time with one fix removed</title>
  <desc id="perf-ablation-desc">Steady-state milliseconds per training step of the default GPT: about 215 with every fix, 183 without the layout pass, 423 without broadcast staging, 508 with OPT=0, and about 4,700 when AdamW bias corrections are Python float constants, which forces a recompile every step.</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <line x1="268" y1="56" x2="268" y2="380" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <text x="268" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">0</text>
  <line x1="348" y1="56" x2="348" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="348" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">100</text>
  <line x1="428" y1="56" x2="428" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="428" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">200</text>
  <line x1="508" y1="56" x2="508" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="508" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">300</text>
  <line x1="588" y1="56" x2="588" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="588" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">400</text>
  <line x1="668" y1="56" x2="668" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="668" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">500</text>
  <line x1="748" y1="56" x2="748" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="748" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">600</text>
  <line x1="828" y1="56" x2="828" y2="380" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
  <text x="828" y="400" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">700</text>
  <text x="252" y="92" text-anchor="end" font-size="13" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">All fixes</text>
  <text x="252" y="108" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">uopc as shipped</text>
  <rect x="268" y="80" width="172" height="32" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
  <line x1="400" y1="96" x2="451" y2="96" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="400" y1="90" x2="400" y2="102" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="451" y1="90" x2="451" y2="102" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <text x="461" y="100" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">215 ms</text>
  <text x="252" y="156" text-anchor="end" font-size="13" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">No layout pass</text>
  <text x="252" y="172" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">layout_pass off</text>
  <rect x="268" y="144" width="146" height="32" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <line x1="414" y1="160" x2="417" y2="160" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="414" y1="154" x2="414" y2="166" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="417" y1="154" x2="417" y2="166" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <text x="427" y="164" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">183 ms</text>

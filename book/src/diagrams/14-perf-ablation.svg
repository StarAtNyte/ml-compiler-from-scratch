  <text x="252" y="236" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">stage_broadcast_compute off</text>
  <rect x="268" y="208" width="338" height="32" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <line x1="598" y1="224" x2="814" y2="224" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="598" y1="218" x2="598" y2="230" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="814" y1="218" x2="814" y2="230" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <text x="824" y="228" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">423 ms</text>
  <text x="252" y="284" text-anchor="end" font-size="13" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">OPT=0</text>
  <text x="252" y="300" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">no layout, tiles or threads</text>
  <rect x="268" y="272" width="406" height="32" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <line x1="667" y1="288" x2="682" y2="288" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="667" y1="282" x2="667" y2="294" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <line x1="682" y1="282" x2="682" y2="294" stroke="rgba(45,49,66,0.55)" stroke-width="1"/>
  <text x="692" y="292" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">508 ms</text>
  <text x="252" y="348" text-anchor="end" font-size="13" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Float bias corrections</text>
  <text x="252" y="364" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">AdamW constants in the graph</text>
  <rect x="268" y="336" width="600" height="32" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="828" y="334" width="10" height="36" fill="#f5f5f5"/>
  <line x1="824" y1="372" x2="832" y2="332" stroke="#4f5d75" stroke-width="1"/>
  <line x1="834" y1="372" x2="842" y2="332" stroke="#4f5d75" stroke-width="1"/>
  <text x="878" y="356" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">≈ 4,700 ms</text>
  <text x="268" y="424" font-size="11" fill="#5a6580" letter-spacing="0.12em" font-family="Geist Mono, JetBrains Mono, monospace">MS PER STEP, STEADY STATE · BAR = MEDIAN OF 3 · WHISKER = MIN–MAX</text>
  <text x="268" y="446" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">default GPT (112.6k params, B=16, T=64), i7-13620H shared with other jobs</text>
</svg>

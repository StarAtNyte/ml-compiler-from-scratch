<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="smem-tiling-title smem-tiling-desc">
  <title id="smem-tiling-title">Shared-memory tiling of a GEMM</title>
  <desc id="smem-tiling-desc">One thread block computes a 16 by 16 tile of C. At each step kt it copies the kt-th 16 by 16 tile of its row panel of A and of its column panel of B into shared memory, synchronizes, multiplies the two tiles out of shared memory into per-thread accumulators, and synchronizes again.</desc>
  <defs><marker id="smem-tiling-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <line x1="424" y1="112" x2="536" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#smem-tiling-arrow)"/>
  <line x1="112" y1="352" x2="112" y2="484" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#smem-tiling-arrow)"/>
  <rect x="280" y="40" width="192" height="192" fill="#ececec" stroke="#2d3142"/>
  <rect x="376" y="40" width="48" height="192" fill="rgba(79,93,117,0.14)"/>
  <rect x="376" y="88" width="48" height="48" fill="rgba(79,93,117,0.50)"/>
  <line x1="328" y1="40" x2="328" y2="232" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="88" x2="472" y2="88" stroke="rgba(45,49,66,0.18)"/>
  <line x1="376" y1="40" x2="376" y2="232" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="136" x2="472" y2="136" stroke="rgba(45,49,66,0.18)"/>
  <line x1="424" y1="40" x2="424" y2="232" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="184" x2="472" y2="184" stroke="rgba(45,49,66,0.18)"/>
  <rect x="40" y="256" width="192" height="192" fill="#ececec" stroke="#2d3142"/>
  <rect x="40" y="304" width="192" height="48" fill="rgba(79,93,117,0.14)"/>
  <rect x="88" y="304" width="48" height="48" fill="rgba(79,93,117,0.50)"/>
  <line x1="88" y1="256" x2="88" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="40" y1="304" x2="232" y2="304" stroke="rgba(45,49,66,0.18)"/>
  <line x1="136" y1="256" x2="136" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="40" y1="352" x2="232" y2="352" stroke="rgba(45,49,66,0.18)"/>
  <line x1="184" y1="256" x2="184" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="40" y1="400" x2="232" y2="400" stroke="rgba(45,49,66,0.18)"/>
  <rect x="280" y="256" width="192" height="192" fill="#ececec" stroke="#2d3142"/>
  <line x1="328" y1="256" x2="328" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="304" x2="472" y2="304" stroke="rgba(45,49,66,0.18)"/>
  <line x1="376" y1="256" x2="376" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="352" x2="472" y2="352" stroke="rgba(45,49,66,0.18)"/>
  <line x1="424" y1="256" x2="424" y2="448" stroke="rgba(45,49,66,0.18)"/>
  <line x1="280" y1="400" x2="472" y2="400" stroke="rgba(45,49,66,0.18)"/>
  <rect x="376" y="304" width="48" height="48" fill="rgba(191,69,32,0.18)" stroke="#bf4520" stroke-width="1.6"/>
  <text x="264" y="60" text-anchor="end" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">B</text>
  <text x="264" y="78" text-anchor="end" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">K × N</text>
  <text x="40" y="244" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">A <tspan font-size="11" fill="#4f5d75" font-weight="400" font-family="Geist Mono, JetBrains Mono, monospace">M × K</tspan></text>
  <text x="484" y="276" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">C</text>
  <text x="484" y="294" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">M × N</text>
  <text x="280" y="472" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">C tile of block (by=1, bx=2)</text>
  <rect x="540" y="64" width="96" height="96" rx="4" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="588" y="116" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">16 × 16</text>
  <text x="652" y="104" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">sB · __shared__</text>
  <text x="652" y="122" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">tile kt of B</text>
  <rect x="64" y="488" width="96" height="96" rx="4" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="112" y="540" text-anchor="middle" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">16 × 16</text>
  <text x="176" y="528" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">sA · __shared__</text>
  <text x="176" y="546" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">tile kt of A</text>
  <rect x="540" y="232" width="380" height="216" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)"/>
  <text x="556" y="262" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">for kt in 0 .. N/T-1:            # N/T = 4</text>
  <text x="556" y="286" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">  sA[ty][tx] = A[row, kt*T + tx]</text>
  <text x="556" y="310" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">  sB[ty][tx] = B[kt*T + ty, col]</text>
  <text x="556" y="334" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">  __syncthreads()                # tiles complete</text>
  <text x="556" y="358" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">  for k in 0 .. T-1:</text>
  <text x="556" y="382" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">    acc += sA[ty][k] * sB[k][tx]</text>
  <text x="556" y="406" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">  __syncthreads()                # done reading</text>
  <text x="556" y="430" font-size="12" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace" xml:space="preserve">C[row, col] = acc</text>
  <text x="540" y="520" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#4f5d75">Each element of A and B leaves DRAM once per block,</text>
  <text x="540" y="542" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#4f5d75">not once per thread: T = 16 times less traffic.</text>
</svg>

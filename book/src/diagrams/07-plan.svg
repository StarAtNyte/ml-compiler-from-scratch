  <circle cx="400" cy="168" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.4"/>
  <circle cx="600" cy="168" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.4"/>
  <circle cx="800" cy="168" r="7" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.4"/>
  <circle cx="400" cy="240" r="7" fill="#2d3142"/>

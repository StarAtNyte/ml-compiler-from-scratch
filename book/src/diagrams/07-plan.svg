  <text x="166" y="441" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">write</text>
  <rect x="232" y="430" width="36" height="14" rx="4" fill="rgba(45,49,66,0.08)"/>
  <text x="276" y="441" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">buffer alive</text>
  <text x="896" y="441" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">e_4_8.refs = [in 0, tmp 0, tmp 1, out 0]</text>
</svg>

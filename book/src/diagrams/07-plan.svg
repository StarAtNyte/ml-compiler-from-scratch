<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="07-plan-title 07-plan-desc">
  <title id="07-plan-title">A softmax Plan: kernels over buffer lanes</title>
  <desc id="07-plan-desc">Three kernels run in order; each reads and writes buffers referred to as in, tmp and out; the two temporaries live from the kernel that writes them to the last kernel that reads them.</desc>
  <defs>
    <marker id="07-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="07-plan-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="40" y="24" width="880" height="444" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>

  <!-- connectors (before boxes) -->

  <!-- labels -->

  <!-- nodes -->
  <rect x="320" y="68" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="320" y="68" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="400.0" y="92.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">r_4</text>
  <text x="400.0" y="110.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">row max</text>
  <rect x="520" y="68" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="520" y="68" width="160" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="600.0" y="92.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">r_4</text>
  <text x="600.0" y="110.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">row sum of exp</text>
  <rect x="720" y="68" width="160" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="720" y="68" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="800.0" y="92.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#2d3142">e_4_8</text>
  <text x="800.0" y="110.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">exp · 1/sum</text>

  <!-- annotations -->
  <text x="64" y="52" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">BUFFERS</text>
  <text x="896" y="52" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">KERNELS IN SCHEDULE ORDER →</text>
  <line x1="400" y1="124" x2="400" y2="412" stroke="rgba(45,49,66,0.12)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="600" y1="124" x2="600" y2="412" stroke="rgba(45,49,66,0.12)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="800" y1="124" x2="800" y2="412" stroke="rgba(45,49,66,0.12)" stroke-width="1.2" stroke-dasharray="4,4"/>

  <text x="488" y="466" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">16 ACCUMULATORS · REGISTERS</text>
  <text x="488" y="486" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">acc6 += a1 * b2</text>
  <text x="40" y="216" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">for k in 0..K-1</text>
  <text x="40" y="236" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">one loop, shared by</text>
  <text x="40" y="252" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">all 16 copies</text>

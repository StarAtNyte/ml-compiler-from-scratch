  <text x="360" y="84" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">LOAD 4 · Bᵀ[j+c, k]</text>
  <rect x="366" y="100" width="52" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="392.0" y="125" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">b0</text>
  <rect x="430" y="100" width="52" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="456.0" y="125" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">b1</text>
  <rect x="494" y="100" width="52" height="40" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="520.0" y="125" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">b2</text>
  <rect x="558" y="100" width="52" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="584.0" y="125" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">b3</text>
  <text x="334" y="164" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">LOAD 4 · A[i+r, k]</text>
  <rect x="284" y="182" width="52" height="52" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="310" y="212.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">a0</text>
  <rect x="284" y="246" width="52" height="52" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>

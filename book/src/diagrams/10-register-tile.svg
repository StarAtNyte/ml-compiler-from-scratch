<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="tile-title tile-desc">
  <title id="tile-title">A 4x4 register tile</title>
  <desc id="tile-desc">One iteration of the shared reduce loop of a 4 by 4 register tile. Four values of A (rows i to i+3 at column k) and four values of B transposed (rows j to j+3 at column k) are loaded, and their outer product updates sixteen accumulators acc0 to acc15 held in registers. Eight loads feed sixteen multiply-adds, against two loads per multiply-add in the naive loop.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="roof-title roof-desc">
  <title id="roof-title">Roofline of the i7-13620H laptop, with measured kernels</title>
  <desc id="roof-desc">Log-log roofline. Memory roof 55.9 GB/s rising to the compute roof of 777 GFLOP/s (16 threads of AVX2 FMA) at an arithmetic intensity of about 14 FLOP per byte; a dashed one-core ceiling at 117 GFLOP/s. Elementwise kernels sit on the memory roof at 5 to 14 GFLOP/s. The 1024 cubed GEMM has intensity 171 FLOP per byte, and its versions climb from 5.2 GFLOP/s (naive, B strided) to 28.0 (B transposed), 149.1 (threads) and 237.8 (4 by 4 register tile plus threads), below numpy at 449.4.</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <line x1="100" y1="384.0" x2="860" y2="384.0" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="90" y="388.0" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1</text>
  <line x1="100" y1="277.3" x2="860" y2="277.3" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="90" y="281.3" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">10</text>
  <line x1="100" y1="170.7" x2="860" y2="170.7" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="90" y="174.7" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">100</text>
  <line x1="100" y1="64.0" x2="860" y2="64.0" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="90" y="68.0" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1000</text>
  <line x1="100.0" y1="64" x2="100.0" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="100.0" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1/16</text>
  <line x1="208.6" y1="64" x2="208.6" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="208.6" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1/4</text>
  <line x1="317.1" y1="64" x2="317.1" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="317.1" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1</text>
  <line x1="425.7" y1="64" x2="425.7" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="425.7" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">4</text>
  <line x1="534.3" y1="64" x2="534.3" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="534.3" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">16</text>
  <line x1="642.9" y1="64" x2="642.9" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="642.9" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">64</text>
  <line x1="751.4" y1="64" x2="751.4" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="751.4" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">256</text>
  <line x1="860.0" y1="64" x2="860.0" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="860.0" y="402" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1024</text>
  <rect x="100" y="64" width="760" height="320" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="480.0" y="426" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.08em">ARITHMETIC INTENSITY (FLOP / BYTE OF DRAM TRAFFIC)</text>
  <text x="28" y="224.0" text-anchor="middle" transform="rotate(-90 28 224.0)" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.08em">GFLOP/S</text>
  <polyline points="100.0,326.0 523.2,75.7 860.0,75.7" fill="none" stroke="#2d3142" stroke-width="2"/>
  <line x1="375.0" y1="163.4" x2="860.0" y2="163.4" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="533.2" y="93.7" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">16 threads · 777 GFLOP/s</text>
  <text x="533.2" y="180.4" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">1 core · 117 GFLOP/s</text>
  <text x="234.9" y="232.2" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142" transform="rotate(-30.6 234.9 232.2)">DRAM · 55.9 GB/s</text>
  <line x1="523.2" y1="79.7" x2="523.2" y2="384" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="529.2" y="376" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">ridge ≈ 14</text>
  <circle cx="154.3" cy="308.5" r="4" fill="#2d3142"/>
  <text x="163.3" y="312.5" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">out = a*2</text>
  <circle cx="208.6" cy="261.7" r="4" fill="#2d3142"/>
  <text x="217.6" y="265.7" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">row sum</text>
  <line x1="719.7" y1="307.6" x2="719.7" y2="130.5" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
  <circle cx="719.7" cy="307.6" r="4" fill="#2d3142"/>
  <text x="709.7" y="311.6" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">naive, B strided · 5.2</text>
  <circle cx="719.7" cy="229.6" r="4" fill="#2d3142"/>
  <text x="709.7" y="233.6" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">naive, Bᵀ · 28.0</text>
  <circle cx="719.7" cy="152.2" r="4" fill="#2d3142"/>
  <text x="709.7" y="156.2" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2d3142">Bᵀ + threads · 149.1</text>
  <circle cx="719.7" cy="130.5" r="5" fill="#bf4520"/>
  <text x="709.7" y="134.5" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">4x4 tile + threads · 237.8</text>
  <circle cx="719.7" cy="101.1" r="7" fill="none" stroke="#2e5aa8" stroke-width="1.4"/>
  <text x="731.7" y="119.1" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#2e5aa8">numpy · 449.4</text>
  <text x="709.7" y="331.6" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580">GEMM 1024³ · AI = N/6</text>
  <text x="116" y="90" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">same FLOPs, same bytes: 46x apart</text>
</svg>

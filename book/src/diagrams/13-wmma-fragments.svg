<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="wmma-title wmma-desc">
  <title id="wmma-title">WMMA fragments: one warp computes one 16 x 16 tile</title>
  <desc id="wmma-desc">For each step k of 16, a warp loads a 16 by 16 tile of A and of B into register fragments spread across its 32 lanes, calls mma_sync to accumulate their product into an accumulator fragment of 256 floats, 8 per lane, and finally stores the accumulator into C.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="06-reduce-lowering-title 06-reduce-lowering-desc">
  <title id="06-reduce-lowering-title">Lowering a REDUCE: accumulator, loop, read-back</title>
  <desc id="06-reduce-lowering-desc">A row sum becomes an accumulator allocated per output row, initialized, updated inside a new reduce loop, and read back after the loop ends; each step is an AFTER, STORE, END or LOAD node.</desc>
  <defs>
    <marker id="06-reduce-lowering-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="06-reduce-lowering-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="40" y="24" width="880" height="652" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="56" y="46" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">for (ridx0 = 0; ridx0 &lt; 3)  ·  LOOP i</text>
  <rect x="64" y="260" width="832" height="200" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)"/>
  <text x="880" y="282" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">for (ridx1 = 0; ridx1 &lt; 4)  ·  REDUCE k</text>

  <!-- connectors (before boxes) -->
  <path d="M 298 120 L 298 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-reduce-lowering-arrow)"/>
  <path d="M 298 208 L 298 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-reduce-lowering-arrow)"/>
  <path d="M 298 356 L 298 388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-reduce-lowering-arrow)"/>
  <path d="M 298 444 L 298 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-reduce-lowering-arrow)"/>
  <path d="M 298 552 L 298 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-reduce-lowering-arrow)"/>

  <!-- labels -->

  <!-- nodes -->
  <rect x="88" y="64" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="64" width="420" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="298.0" y="88.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">accumulator, one per i</text>
  <text x="298.0" y="106.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">acc0 = AFTER(ALLOC, i)</text>
  <rect x="88" y="152" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="152" width="420" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="298.0" y="176.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">initialize</text>
  <text x="298.0" y="194.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">STORE(acc0[0], 0.0)</text>
  <rect x="88" y="300" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="300" width="420" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="298.0" y="324.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">inside the reduce loop</text>
  <text x="298.0" y="342.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">accl = AFTER(acc0, init, k)</text>
  <rect x="88" y="388" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="388" width="420" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="298.0" y="412.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">update</text>
  <text x="298.0" y="430.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">STORE(accl[0], accl[0] + x[i*4 + k])</text>
  <rect x="88" y="496" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="496" width="420" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142"/>
  <text x="298.0" y="520.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">close the reduce loop</text>
  <text x="298.0" y="538.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">END(update, k)</text>
  <rect x="88" y="592" width="420" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="88" y="592" width="420" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="298.0" y="616.0" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">read back after the loop</text>
  <text x="298.0" y="634.0" text-anchor="middle" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">LOAD(AFTER(acc0, END)[0])</text>

  <!-- annotations -->
  <text x="560" y="97" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">float acc0;</text>
  <text x="560" y="185" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">acc0 = 0.0f;</text>
  <text x="560" y="333" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">float val1 = acc0;</text>
  <text x="560" y="421" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">acc0 = (val1+val2);</text>
  <text x="560" y="529" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">}</text>
  <text x="560" y="625" text-anchor="start" font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#2d3142">data99[i] = acc0;</text>
  <text x="560" y="54" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">GENERATED C</text>
  <text x="560" y="652" text-anchor="start" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">AFTER makes each state of acc0 a distinct node</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="onl-title onl-desc">
  <title id="onl-title">Online softmax, one key at a time</title>
  <desc id="onl-desc">The running state m, l and o of online softmax for one query with scores 1, 3, 2 and values 10, 20, 30. Key 0 sets m to 1, l to 1, o to 10. Key 1 raises the maximum to 3, so the old l and o are rescaled by exp(1 - 3) = 0.1353, giving l = 1.1353 and o = 21.3534. Key 2 does not change the maximum; l = 1.5032, o = 32.3897. The result o / l = 21.546979 equals the two-pass softmax(s) times v.</desc>
  <defs><marker id="onl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="24" y="44" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">ONE QUERY ROW · SCORES s = (1, 3, 2) · VALUES v = (10, 20, 30) · D = 1</text>
  <line x1="188" y1="158.0" x2="206" y2="158.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#onl-arrow)"/>
  <line x1="376" y1="158.0" x2="394" y2="158.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#onl-arrow)"/>
  <line x1="564" y1="158.0" x2="582" y2="158.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#onl-arrow)"/>
  <line x1="752" y1="158.0" x2="770" y2="158.0" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#onl-arrow)"/>
  <rect x="24" y="76" width="164" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="40" y="102" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">start</text>
  <line x1="36" y1="114" x2="176" y2="114" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="40" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">m</text>
  <text x="172" y="136" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">-inf</text>
  <text x="40" y="158" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">l</text>
  <text x="172" y="158" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">0</text>
  <text x="40" y="180" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">o</text>
  <text x="172" y="180" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">0</text>
  <rect x="212" y="76" width="164" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="228" y="102" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">key 0</text>
  <text x="360" y="102" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">s = 1</text>
  <line x1="224" y1="114" x2="364" y2="114" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="228" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">m</text>
  <text x="360" y="136" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <text x="228" y="158" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">corr</text>
  <text x="360" y="158" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">0</text>
  <text x="228" y="180" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">p</text>
  <text x="360" y="180" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <text x="228" y="202" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">l</text>
  <text x="360" y="202" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <text x="228" y="224" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">o</text>
  <text x="360" y="224" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">10</text>
  <rect x="400" y="76" width="164" height="164" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
  <text x="416" y="102" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">key 1</text>
  <text x="548" y="102" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">s = 3</text>
  <line x1="412" y1="114" x2="552" y2="114" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="416" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">m</text>
  <text x="548" y="136" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">3</text>
  <text x="416" y="158" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#bf4520">corr</text>
  <text x="548" y="158" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#bf4520">0.1353</text>
  <text x="416" y="180" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">p</text>
  <text x="548" y="180" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <text x="416" y="202" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">l</text>
  <text x="548" y="202" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1.1353</text>
  <text x="416" y="224" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">o</text>
  <text x="548" y="224" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">21.3534</text>
  <rect x="588" y="76" width="164" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="604" y="102" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">key 2</text>
  <text x="736" y="102" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">s = 2</text>
  <line x1="600" y1="114" x2="740" y2="114" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="604" y="136" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">m</text>
  <text x="736" y="136" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">3</text>
  <text x="604" y="158" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">corr</text>
  <text x="736" y="158" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1</text>
  <text x="604" y="180" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">p</text>
  <text x="736" y="180" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">0.3679</text>
  <text x="604" y="202" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">l</text>
  <text x="736" y="202" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">1.5032</text>
  <text x="604" y="224" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">o</text>
  <text x="736" y="224" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">32.3897</text>
  <rect x="776" y="76" width="164" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="792" y="102" font-family="Geist, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#2d3142">o / l</text>
  <line x1="788" y1="114" x2="928" y2="114" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="924" y="136" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">21.546979</text>
  <text x="792" y="182" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">two-pass</text>
  <text x="792" y="200" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#4f5d75">softmax(s)·v</text>
  <text x="924" y="222" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">21.546979</text>
  <text x="24" y="280" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" fill="#5a6580" letter-spacing="0.12em">PER KEY j</text>
  <text x="24" y="304" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">m' = max(m, s_j)</text>
  <text x="174.8" y="304" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">corr = exp(m - m')</text>
  <text x="340.20000000000005" y="304" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">p = exp(s_j - m')</text>
  <text x="498.30000000000007" y="304" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">l = l·corr + p</text>
  <text x="634.5" y="304" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12" fill="#2d3142">o = o·corr + p·v_j</text>
  <text x="24" y="344" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="16" fill="#4f5d75">a new maximum shrinks everything accumulated so far by the same factor</text>
</svg>

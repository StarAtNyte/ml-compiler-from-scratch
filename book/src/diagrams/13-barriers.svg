  <line x1="334" y1="246" x2="334" y2="344" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="334" y="242" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">sync 1</text>
  <line x1="694" y1="246" x2="694" y2="344" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="694" y="242" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">sync 1</text>
  <text x="40" y="276" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">warp 0 · fast</text>
  <text x="40" y="324" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">warp 7 · slow</text>

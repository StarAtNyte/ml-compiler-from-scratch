<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="barriers-title barriers-desc">
  <title id="barriers-title">Why the tiled GEMM needs two barriers</title>
  <desc id="barriers-desc">Timeline of a fast and a slow warp in one block. With both barriers, no warp copies the next tile until every warp has finished computing on the current one. Without the second barrier the fast warp overwrites the shared tile while the slow warp is still reading it.</desc>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="40" font-size="14" font-weight="600" fill="#2d3142" font-family="Geist, Inter, system-ui, sans-serif">Both barriers</text>
  <line x1="334" y1="54" x2="334" y2="152" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="334" y="50" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">sync 1</text>
  <line x1="534" y1="54" x2="534" y2="152" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="534" y="50" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">sync 2</text>
  <line x1="694" y1="54" x2="694" y2="152" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="694" y="50" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">sync 1</text>
  <text x="40" y="84" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">warp 0 · fast</text>
  <text x="40" y="132" font-size="11" fill="#4f5d75" font-family="Geist Mono, JetBrains Mono, monospace">warp 7 · slow</text>
  <rect x="152" y="64" width="100" height="32" rx="3" fill="rgba(79,93,117,0.22)" stroke="#4f5d75"/>
  <text x="202.0" y="84" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 0</text>
  <rect x="252" y="64" width="80" height="32" rx="3" fill="none" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/>
  <text x="292.0" y="84" text-anchor="middle" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">wait</text>
  <rect x="336" y="64" width="140" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="406.0" y="84" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 0</text>

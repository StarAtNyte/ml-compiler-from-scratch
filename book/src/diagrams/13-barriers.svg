  <rect x="336" y="112" width="196" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="434.0" y="132" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 0</text>
  <rect x="536" y="112" width="156" height="32" rx="3" fill="rgba(79,93,117,0.22)" stroke="#4f5d75"/>
  <text x="614.0" y="132" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 1</text>

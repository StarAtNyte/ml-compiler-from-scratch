  <text x="504.0" y="84" text-anchor="middle" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">wait</text>
  <rect x="536" y="64" width="100" height="32" rx="3" fill="rgba(79,93,117,0.22)" stroke="#4f5d75"/>
  <text x="586.0" y="84" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 1</text>
  <rect x="636" y="64" width="56" height="32" rx="3" fill="none" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/>
  <text x="664.0" y="84" text-anchor="middle" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">wait</text>

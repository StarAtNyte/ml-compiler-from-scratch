  <text x="202.0" y="276" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 0</text>
  <rect x="252" y="256" width="80" height="32" rx="3" fill="none" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/>
  <text x="292.0" y="276" text-anchor="middle" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">wait</text>
  <rect x="336" y="256" width="140" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="406.0" y="276" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 0</text>
  <rect x="480" y="256" width="100" height="32" rx="3" fill="rgba(191,69,32,0.16)" stroke="#bf4520"/>
  <text x="530.0" y="276" text-anchor="middle" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">copy 1</text>
  <rect x="580" y="256" width="112" height="32" rx="3" fill="none" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/>
  <text x="636.0" y="276" text-anchor="middle" font-size="11" fill="#5a6580" font-family="Geist Mono, JetBrains Mono, monospace">wait</text>
  <rect x="696" y="256" width="140" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="766.0" y="276" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 1</text>
  <rect x="152" y="304" width="180" height="32" rx="3" fill="rgba(79,93,117,0.22)" stroke="#4f5d75"/>
  <text x="242.0" y="324" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 0</text>
  <rect x="336" y="304" width="196" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="434.0" y="324" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 0</text>
  <rect x="536" y="304" width="156" height="32" rx="3" fill="rgba(79,93,117,0.22)" stroke="#4f5d75"/>
  <text x="614.0" y="324" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">copy 1</text>
  <rect x="696" y="304" width="200" height="32" rx="3" fill="#ececec" stroke="#2d3142"/>
  <text x="796.0" y="324" text-anchor="middle" font-size="11" fill="#2d3142" font-family="Geist Mono, JetBrains Mono, monospace">compute 1</text>
  <rect x="480" y="300" width="52" height="40" fill="rgba(191,69,32,0.10)"/>
  <text x="480" y="372" font-size="11" fill="#bf4520" font-family="Geist Mono, JetBrains Mono, monospace">race: tile 0 in sA is overwritten while warp 7 still reads it</text>
  <text x="40" y="430" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="17" fill="#4f5d75">Sync 1 orders writes before reads (RAW). Sync 2 orders reads before the next overwrite (WAR).</text>
</svg>

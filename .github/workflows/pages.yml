name: Test and publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test the compiler
        run: python -m pytest -q
      - name: Build the book (site + PDF)
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
          python tools/build_book.py --pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
